<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장르 태그 선택기</title>
<style>
  :root { --bg:#0e1621; --panel:#16202e; --line:#25344a; --text:#e6edf5; --muted:#8fa1b8; --accent:#4cb4f5; --good:#2f9e6b; --warn:#e0a63a; --bad:#e06a6a; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f6f9; --panel:#fff; --line:#d7dee8; --text:#1b2533; --muted:#5d6b7e; --accent:#1a73c8; --good:#1f8a58; --warn:#b97a12; --bad:#c0392b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:24px 16px 110px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { margin:0 0 14px; color:var(--muted); }
  .steps { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .steps ol { margin:6px 0 0; padding-left:20px; color:var(--muted); }
  .steps b { color:var(--text); }
  .bar { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; border-bottom:1px solid var(--line); }
  input[type=search] { flex:1 1 220px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; }
  button { font:inherit; cursor:pointer; }
  .btn { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.small { padding:3px 9px; font-size:12px; }
  details { background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-top:12px; }
  summary { list-style:none; cursor:pointer; padding:12px 14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"▸"; color:var(--muted); width:14px; }
  details[open] > summary::before { content:"▾"; }
  .cname { font-weight:700; font-size:15px; }
  .count { color:var(--muted); font-size:12px; }
  .verdict { font-size:12px; padding:1px 9px; border-radius:99px; border:1px solid; }
  .verdict.good { color:var(--good); border-color:var(--good); }
  .verdict.warn { color:var(--warn); border-color:var(--warn); }
  .verdict.bad { color:var(--bad); border-color:var(--bad); }
  .spacer { flex:1; }
  .cdesc { padding:0 14px 8px 28px; color:var(--muted); font-size:13px; }
  .tags { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:4px 10px; padding:4px 14px 14px; }
  label.tag { display:flex; align-items:center; gap:7px; padding:5px 8px; border-radius:8px; border:1px solid transparent; cursor:pointer; }
  label.tag:hover { background:color-mix(in srgb, var(--accent) 10%, transparent); }
  label.tag.on { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); }
  label.tag.changed { box-shadow:inset 0 0 0 1px var(--warn); }
  label.tag small { color:var(--muted); margin-left:auto; font-size:11px; }
  input[type=checkbox] { width:17px; height:17px; accent-color:var(--accent); }
  .note { color:var(--warn); font-size:11px; }
  .empty { padding:24px; color:var(--muted); text-align:center; }
  .foot { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:10px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .sum { color:var(--muted); }
  .mode { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .mode button { background:var(--panel); color:var(--muted); border:0; padding:8px 12px; }
  .mode button.on { background:var(--accent); color:#fff; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; max-width:760px; width:92vw; }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  textarea { width:100%; height:300px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font:12px/1.5 ui-monospace,Consolas,monospace; }
</style>
</head>
<body>
<div class="wrap">
  <h1>장르 태그 선택기</h1>
  <p class="sub">Steam 태그 <span id="total"></span>개를 성격별로 묶었습니다. 지금은 <b>장르 레벨에 쓸 태그</b>를 고르는 화면입니다.</p>

  <div class="steps">
    <b>소거법으로 3단계면 끝납니다</b>
    <ol>
      <li><b>추천 구성 적용</b> — 큰 장르 16개만 남기고 나머지는 모두 해제합니다. (아래 버튼)</li>
      <li>아래 <b>분류 9개</b>를 위에서부터 보면서, <span class="verdict warn">고민</span>인 곳만 열어 확인합니다. <span class="verdict bad">부적합</span> 분류는 안 봐도 됩니다.</li>
      <li><b>코드 복사</b> → 채팅에 붙여 넣기.</li>
    </ol>
    <p style="margin:10px 0 0">
      <button class="btn primary" id="preset">추천 구성 적용 (16개)</button>
      <button class="btn" id="reset">처음 상태로</button>
    </p>
  </div>

  <div class="bar">
    <input type="search" id="q" placeholder="태그 이름 검색 (예: 로그, 슈팅)">
    <div class="mode" id="mode">
      <button data-m="level" class="on">레벨에 쓸 태그</button>
      <button data-m="filter">필터 목록</button>
    </div>
  </div>

  <div id="groups"></div>
</div>

<div class="foot">
  <span class="sum" id="sum"></span>
  <button class="btn primary" id="export">코드 복사</button>
</div>

<dialog id="dlg">
  <p>아래 내용을 복사해서 채팅에 붙여 넣어 주세요.</p>
  <textarea id="out" readonly></textarea>
  <p style="text-align:right;margin:10px 0 0"><button class="btn" id="copy">클립보드에 복사</button> <button class="btn" id="close">닫기</button></p>
</dialog>

const KEY = "genre-tag-picker:v2";
const CATS = [
  { id:"core",  name:"① 큰 장르",          verdict:["good","적합"],   open:true,
    desc:"액션·RPG·전략처럼 게임을 가르는 큰 분류. 레벨의 주 재료입니다. 어드벤처는 거의 모든 게임에 붙는 넓은 태그라 기본 해제했습니다." },
  { id:"sub",   name:"② 세부 장르·유형",   verdict:["warn","고민"],   open:false,
    desc:"로그라이크, JRPG, 1인칭 슈팅, 4X, 농장 시뮬레이션처럼 큰 장르의 세분화. 넣으면 한 게임이 여러 칸에 쪼개져 레벨이 흩어집니다. 꼭 따로 보고 싶은 것(예: 로그라이크, 소울라이크)만 고르세요." },
  { id:"mech",  name:"③ 게임 방식",        verdict:["warn","고민"],   open:false,
    desc:"생존, 샌드박스, 크래프팅, 오픈 월드 같은 플레이 방식. 장르가 아니라 특징입니다. 정말 '생존 게임 Lv.5'를 보고 싶을 때만 고르세요." },
  { id:"mode",  name:"④ 인원·모드",        verdict:["bad","부적합"],  open:false,
    desc:"싱글/멀티/협동/PvP. 취향이 아니라 플레이 형태라 레벨에는 맞지 않습니다." },
  { id:"meta",  name:"⑤ 출시·등급·기기",   verdict:["bad","부적합"],  open:false,
    desc:"인디, 캐주얼, 앞서 해보기, 무료 플레이, VR, 폭력성 등. 장르가 아닙니다. 특히 인디/캐주얼은 거의 모든 게임에 붙어 진짜 장르 시간을 나눠 먹습니다." },
  { id:"view",  name:"⑥ 시점·그래픽·사운드", verdict:["bad","부적합"], open:false,
    desc:"1인칭, 2D, 픽셀 그래픽, 사운드트랙 등. 보이는 모습이지 장르가 아닙니다." },
  { id:"theme", name:"⑦ 분위기·소재",      verdict:["bad","부적합"],  open:false,
    desc:"판타지, 좀비, 우주, 귀여운, 어두운 등. 이야기 배경과 분위기라 레벨에는 맞지 않습니다. (필터에는 유용)" },
  { id:"sport", name:"⑧ 스포츠 종목·탈것", verdict:["warn","고민"],  open:false,
    desc:"축구, 야구, 골프, 오토바이, 잠수함 등 세부 종목. '스포츠' 하나로 묶는 게 보통이라 레벨에는 비추천입니다." },
  { id:"sw",    name:"⑨ 비게임 소프트웨어", verdict:["bad","부적합"], open:false,
    desc:"유틸리티, 동영상 제작, 코딩 등 게임이 아닌 프로그램." },
];
const base = new Map(TAGS.map(t => [t.id, { level:t.level, filter:t.filter }]));
let state = new Map(base);
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) for (const [id, v] of s) if (state.has(id)) state.set(id, v); } catch (e) {}
let mode = "level", query = "";
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
$("#total").textContent = TAGS.length;
const changed = id => { const a = state.get(id), b = base.get(id); return a.level !== b.level || a.filter !== b.filter; };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...state])); } catch (e) {} };
const openState = new Map(CATS.map(c => [c.id, c.open]));

function render() {
  const q = query.trim().toLowerCase();
  let html = "";
  for (const c of CATS) {
    let list = TAGS.filter(t => t.cat === c.id);
    const total = list.length;
    const checked = list.filter(t => state.get(t.id)[mode]).length;
    if (q) list = list.filter(t => t.name.toLowerCase().includes(q) || String(t.id).includes(q));
    if (q && !list.length) continue;
    const isOpen = q ? true : openState.get(c.id);
    list.sort((a, b) => (state.get(b.id)[mode] - state.get(a.id)[mode]) || a.name.localeCompare(b.name, "ko"));
    const tags = list.map(t => {
      const on = state.get(t.id)[mode];
      const note = (c.id === "core" && t.name === "어드벤처") ? `<small class="note">넓음</small>` : "";
      return `<label class="tag ${on ? "on" : ""} ${changed(t.id) ? "changed" : ""}"><input type="checkbox" data-id="${t.id}" ${on ? "checked" : ""}>${esc(t.name)}${note}</label>`;
    }).join("");
    html += `<details data-c="${c.id}" ${isOpen ? "open" : ""}><summary>
      <span class="cname">${c.name}</span><span class="verdict ${c.verdict[0]}">${c.verdict[1]}</span>
      <span class="count">${total}개 중 <b>${checked}</b>개 선택</span><span class="spacer"></span>
      <button class="btn small" data-clear="${c.id}">이 분류 전체 해제</button></summary>
      <div class="cdesc">${c.desc}</div><div class="tags">${tags}</div></details>`;
  }
  $("#groups").innerHTML = html || `<div class="empty">해당하는 태그가 없습니다.</div>`;
  summary();
}
function summary() {
  const lv = [...state.values()].filter(v => v.level).length, fl = [...state.values()].filter(v => v.filter).length;
  const ch = TAGS.filter(t => changed(t.id)).length;
  $("#sum").textContent = `레벨 ${lv}개 · 필터 ${fl}개 · 변경 ${ch}건`;
}
$("#groups").addEventListener("change", e => {
  const el = e.target; if (!el.dataset.id) return;
  const id = Number(el.dataset.id), s = { ...state.get(id) };
  s[mode] = el.checked; state.set(id, s); save();
  const lab = el.closest("label"); lab.classList.toggle("on", el.checked); lab.classList.toggle("changed", changed(id));
  const det = el.closest("details"); const c = det.dataset.c;
  const list = TAGS.filter(t => t.cat === c);
  det.querySelector(".count").innerHTML = `${list.length}개 중 <b>${list.filter(t => state.get(t.id)[mode]).length}</b>개 선택`;
  summary();
});
$("#groups").addEventListener("click", e => {
  const b = e.target.closest("[data-clear]");
  if (b) {
    e.preventDefault();
    for (const t of TAGS.filter(t => t.cat === b.dataset.clear)) state.set(t.id, { ...state.get(t.id), [mode]: false });
    save(); render(); return;
  }
});
$("#groups").addEventListener("toggle", e => {
  const d = e.target; if (d.tagName === "DETAILS" && !query.trim()) openState.set(d.dataset.c, d.open);
}, true);
$("#q").addEventListener("input", e => { query = e.target.value; render(); });
$("#mode").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.m; document.querySelectorAll("#mode button").forEach(x => x.classList.toggle("on", x === b)); render();
});
$("#preset").addEventListener("click", () => {
  if (!confirm("레벨 태그를 추천 구성(큰 장르 16개)으로 바꿀까요? 지금까지 고른 레벨 선택은 사라집니다.")) return;
  for (const t of TAGS) state.set(t.id, { ...state.get(t.id), level: !!t.rec });
  mode = "level"; document.querySelectorAll("#mode button").forEach(x => x.classList.toggle("on", x.dataset.m === "level"));
  save(); render();
});
$("#reset").addEventListener("click", () => { if (confirm("처음 상태로 되돌릴까요?")) { state = new Map(base); save(); render(); } });

function buildCode() {
  const pick = k => TAGS.filter(t => state.get(t.id)[k]);
  const fmt = (name, arr) => `export const ${name} = new Set([\n` + arr.map(t => `  ${t.id}, // ${t.name}`).join("\n") + `\n]);`;
  const ch = TAGS.filter(t => changed(t.id)).map(t => {
    const a = state.get(t.id), b = base.get(t.id), p = [];
    if (a.level !== b.level) p.push(`레벨 ${a.level ? "추가" : "제외"}`);
    if (a.filter !== b.filter) p.push(`필터 ${a.filter ? "추가" : "제외"}`);
    return `// ${t.name} (${t.id}): ${p.join(", ")}`;
  });
  return `// 변경 ${ch.length}건\n${ch.join("\n")}\n\n${fmt("GENRE_LEVEL_ALLOWLIST_IDS", pick("level"))}\n\n${fmt("GENRE_ALLOWLIST_IDS", pick("filter"))}\n`;
}
$("#export").addEventListener("click", () => { $("#out").value = buildCode(); $("#dlg").showModal(); });
$("#close").addEventListener("click", () => $("#dlg").close());
$("#copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("#out").value); }
  catch (e) { $("#out").select(); document.execCommand("copy"); }
  $("#copy").textContent = "복사됨!"; setTimeout(() => $("#copy").textContent = "클립보드에 복사", 1500);
});
render();
</script>
